<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - CinemaFlow</title>
  
  <link rel="stylesheet" th:href="@{/css/cinema-flow.css}">
  <style>
    .auth-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--cf-bg-base) 0%, #170707 100%);
      padding: 2rem;
    }
    .auth-card {
      background: var(--cf-bg-surface-elevated);
      border: 1px solid var(--cf-border-medium);
      border-radius: var(--cf-radius-lg);
      padding: 3rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    
    .auth-brand {
      display: flex;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .auth-brand .cf-brand-mark {
      width: 32px;
      height: 32px;
    }
    .auth-brand span {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }
    .text-vermilion {
      color: var(--cf-accent-primary);
    }
    
    .auth-title {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 2rem;
      color: var(--cf-text-primary);
    }
    
    .auth-input-group {
      margin-bottom: 1.5rem;
    }
    .auth-input-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: var(--cf-text-secondary);
    }
    .auth-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--cf-bg-surface);
      border: 1px solid var(--cf-border-medium);
      border-radius: var(--cf-radius-sm);
      color: #fff;
      font-family: inherit;
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--cf-accent-primary);
    }
    
    .auth-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      margin-top: 1rem;
    }
    
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 2rem 0;
      color: var(--cf-text-muted);
      font-size: 0.85rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--cf-border-subtle);
    }
    .auth-divider::before { margin-right: 1rem; }
    .auth-divider::after { margin-left: 1rem; }
    
    .auth-social {
      display: flex;
      gap: 1rem;
    }
    .auth-social-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: var(--cf-bg-surface);
      border: 1px solid var(--cf-border-medium);
      border-radius: var(--cf-radius-sm);
      color: var(--cf-text-primary);
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-social-btn:hover {
      background: var(--cf-bg-base);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--cf-text-secondary);
    }
    .auth-footer a {
      color: var(--cf-accent-primary);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <a th:href="@{/}" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
        <div class="cf-brand-mark" style="background: var(--cf-accent-primary); border-radius: 6px; display: flex; justify-content: center; align-items: center;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM9 16.5v-9l7 4.5-7 4.5z"/>
          </svg>
        </div>
        <span>Cinema<span class="text-vermilion">Flow</span></span>
      </a>
    </div>
    
    <h1 class="auth-title">Welcome to CinemaFlow</h1>
    
    <form action="#" method="get">
      <div class="auth-input-group">
        <label for="email">Email Address or Mobile Number</label>
        <input type="text" id="email" class="auth-input" placeholder="Enter your email or mobile" required>
      </div>
      
      <div class="auth-input-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="auth-input" placeholder="Enter your password" required>
      </div>
      
      <button th:href="@{/}" type="button" onclick="window.location.href='/'" class="cf-btn cf-btn-primary auth-btn">Continue</button>
    </form>
    
    <div class="auth-divider">OR</div>
    
    <div class="auth-social">
      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
        Google
      </button>
      <button class="auth-social-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>
        Facebook
      </button>
    </div>
    
    <div class="auth-footer">
      Don't have an account? <a href="#">Sign up now</a>
    </div>
  </div>
</body>
</html>
