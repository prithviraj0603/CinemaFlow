<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${movie.title + ' - Select Showtime'}">Select Showtime</title>
  
  <link rel="stylesheet" th:href="@{/css/cinema-flow.css}">
  <style>
    .st-header {
      background: var(--cf-bg-surface);
      border-bottom: 1px solid var(--cf-border-medium);
      padding: 1.5rem 0;
    }
    .st-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .st-meta {
      color: var(--cf-text-secondary);
      font-size: 0.95rem;
    }
    
    .st-dates {
      display: flex;
      gap: 1rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--cf-border-subtle);
      overflow-x: auto;
    }
    .st-date-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
      padding: 0.75rem 1rem;
      border-radius: var(--cf-radius-md);
      background: var(--cf-bg-surface-elevated);
      border: 1px solid var(--cf-border-medium);
      color: var(--cf-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .st-date-btn:hover {
      border-color: var(--cf-text-primary);
    }
    .st-date-btn.active {
      background: var(--cf-accent-primary);
      border-color: var(--cf-accent-primary);
      color: #fff;
    }
    .st-date-day { font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.25rem; font-weight: bold; }
    .st-date-num { font-size: 1.4rem; font-weight: bold; }
    .st-date-mon { font-size: 0.8rem; }
    
    .st-cinema-list {
      padding: 2rem 0 4rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .st-cinema {
      background: var(--cf-bg-surface);
      border: 1px solid var(--cf-border-subtle);
      border-radius: var(--cf-radius-lg);
      padding: 1.5rem;
    }
    .st-cinema-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
    .st-cinema-name {
      font-size: 1.25rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .st-cinema-address {
      color: var(--cf-text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .st-formats {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .st-format-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .st-format-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--cf-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .st-times {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .st-time-pill {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 1.25rem;
      border-radius: var(--cf-radius-sm);
      border: 1px solid var(--cf-border-medium);
      color: var(--cf-text-primary);
      text-decoration: none;
      transition: all 0.2s;
    }
    .st-time-pill:hover {
      border-color: var(--cf-accent-primary);
      background: rgba(239, 68, 68, 0.1);
    }
    .st-time-val { font-size: 1.1rem; font-weight: 600; }
    .st-time-status { font-size: 0.7rem; color: #10B981; margin-top: 0.2rem; }
  </style>
</head>
<body style="background-color: var(--cf-bg-base); color: #FFFFFF; display: flex; flex-direction: column; min-height: 100vh;">

  <div th:replace="~{fragments/header :: header}"></div>

  <div class="st-header">
    <div class="cf-container">
      <h1 class="st-title" th:text="${movie.title}">Movie Title</h1>
      <div class="st-meta">
        <span th:text="${movie.censorRating}">PG-13</span> • <span th:text="${movie.duration}">2h 30m</span>
      </div>
    </div>
  </div>

  <main style="flex: 1;" class="cf-container">
    <div class="st-dates" id="date-selector-container">
      <!-- Dates generated by JavaScript -->
    </div>
    
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('date-selector-container');
        const today = new Date();
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        
        let html = '';
        for (let i = 0; i < 7; i++) {
          const d = new Date(today);
          d.setDate(today.getDate() + i);
          
          let dayName = i === 0 ? 'TODAY' : (i === 1 ? 'TMRW' : days[d.getDay()]);
          let num = d.getDate().toString().padStart(2, '0');
          let mon = months[d.getMonth()];
          
          let activeClass = i === 0 ? 'active' : '';
          html += `<button class="st-date-btn ${activeClass}" onclick="selectDate(this)">
            <span class="st-date-day">${dayName}</span>
            <span class="st-date-num">${num}</span>
            <span class="st-date-mon">${mon}</span>
          </button>`;
        }
        container.innerHTML = html;
      });
      
      function selectDate(btn) {
        document.querySelectorAll('.st-date-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // In a real app, this would trigger an AJAX fetch for new showtimes
      }
    </script>

    <div class="st-cinema-list" id="cinema-list-container">
      
      <!-- Cinemas will be populated dynamically via JavaScript based on selected city -->
      
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Fetch city directly from LocalStorage which is managed by home.js/discover.js
      const savedCity = localStorage.getItem('cinemaflow_city');
      let cityKey = 'bengaluru';
      
      if (savedCity) {
        try {
          const cityObj = JSON.parse(savedCity);
          // Set the header DOM so it aligns visually too!
          const cityLabelEl = document.getElementById('current-city-label');
          if (cityLabelEl && cityObj.name) {
            cityLabelEl.textContent = cityObj.name;
          }
          if (cityObj.id) {
            cityKey = cityObj.id;
          }
        } catch(e) {}
      }
      
      const cityTheaters = {
        'bengaluru': [
          { name: 'PVR: Orion Mall, Rajajinagar', addr: 'Dr Rajkumar Road, Malleshwaram West, Bangalore', formats: [{label: 'IMAX 2D', times: ['10:30 AM', '02:15 PM', '08:45 PM']}, {label: 'STANDARD 2D', times: ['11:00 AM', '06:20 PM']}] },
          { name: 'INOX: Garuda Mall, Magrath Road', addr: 'Ashok Nagar, Bangalore', formats: [{label: '4DX 3D', times: ['12:30 PM', '05:00 PM', '09:30 PM']}] }
        ],
        'delhi': [
          { name: 'PVR: Select City Walk, Saket', addr: 'A-3, District Centre, Saket, New Delhi', formats: [{label: 'IMAX 3D', times: ['09:15 AM', '01:30 PM', '07:45 PM']}, {label: 'STANDARD 2D', times: ['10:45 AM', '04:20 PM']}] },
          { name: 'INOX: Nehru Place', addr: 'Epicuria Mall, Nehru Place, New Delhi', formats: [{label: 'STANDARD 2D', times: ['11:30 AM', '03:15 PM', '08:30 PM']}] },
          { name: 'Cinepolis: DLF Avenue', addr: 'DLF Avenue, Saket, New Delhi', formats: [{label: '4DX 3D', times: ['12:00 PM', '06:00 PM']}] }
        ],
        'mumbai': [
          { name: 'PVR: Phoenix Palladium, Lower Parel', addr: 'Senapati Bapat Marg, Lower Parel, Mumbai', formats: [{label: 'IMAX 2D', times: ['10:00 AM', '02:45 PM', '09:15 PM']}] },
          { name: 'INOX: R-City Mall, Ghatkopar', addr: 'LBS Marg, Ghatkopar West, Mumbai', formats: [{label: 'STANDARD 2D', times: ['11:15 AM', '04:30 PM', '08:00 PM']}] }
        ],
        'chennai': [
          { name: 'PVR: VR Mall, Anna Nagar', addr: '100 Feet Rd, Anna Nagar, Chennai', formats: [{label: 'IMAX 3D', times: ['09:45 AM', '02:30 PM', '08:15 PM']}] },
          { name: 'Sathyam Cinemas', addr: 'Royapettah, Chennai', formats: [{label: 'STANDARD 2D', times: ['10:30 AM', '03:45 PM', '10:00 PM']}] }
        ],
        'hyderabad': [
          { name: 'PVR: Inorbit Mall, Cyberabad', addr: 'Madhapur, Hyderabad', formats: [{label: 'IMAX 2D', times: ['10:45 AM', '03:30 PM', '09:45 PM']}] },
          { name: 'AMB Cinemas', addr: 'Sarath City Capital Mall, Kondapur', formats: [{label: 'SCREENX 2D', times: ['11:00 AM', '04:15 PM', '10:30 PM']}] }
        ],
        'pune': [
          { name: 'PVR: Phoenix Marketcity, Viman Nagar', addr: 'Viman Nagar, Pune', formats: [{label: 'IMAX 3D', times: ['09:30 AM', '12:45 PM', '07:30 PM']}] },
          { name: 'Cinepolis: Westend Mall', addr: 'Aundh, Pune', formats: [{label: '4DX 3D', times: ['10:00 AM', '04:15 PM', '10:00 PM']}] }
        ],
        'kolkata': [
          { name: 'INOX: South City Mall', addr: 'Prince Anwar Shah Road, Kolkata', formats: [{label: 'IMAX 2D', times: ['11:00 AM', '03:30 PM', '09:00 PM']}, {label: 'STANDARD 2D', times: ['01:15 PM', '05:45 PM']}] },
          { name: 'PVR: Mani Square', addr: 'EM Bypass, Kolkata', formats: [{label: 'STANDARD 2D', times: ['10:15 AM', '02:45 PM', '08:30 PM']}] }
        ],
        'ahmedabad': [
          { name: 'PVR: Acropolis Mall', addr: 'Thaltej Cross Road, Ahmedabad', formats: [{label: '4DX 3D', times: ['09:00 AM', '02:15 PM', '08:45 PM']}] },
          { name: 'Cinepolis: Alpha One Mall', addr: 'Vastrapur, Ahmedabad', formats: [{label: 'STANDARD 2D', times: ['11:30 AM', '04:00 PM', '09:15 PM']}] }
        ]
      };
      
      const theaters = cityTheaters[cityKey] || cityTheaters['bengaluru'];
      const container = document.getElementById('cinema-list-container');
      
      let html = '';
      
      theaters.forEach((t, i) => {
        let formatsHtml = t.formats.map(f => {
          let timesHtml = f.times.map((time, j) => {
            let status = j % 3 === 1 ? '<span class="st-time-status" style="color:#F59E0B">Filling Fast</span>' : (j % 3 === 2 ? '<span class="st-time-status" style="color:#EF4444">Almost Full</span>' : '<span class="st-time-status">Available</span>');
            return `<a href="/showtimes/${100 + i + j}/seats" class="st-time-pill">
                      <span class="st-time-val">${time}</span>
                      ${status}
                    </a>`;
          }).join('');
          
          return `<div class="st-format-row">
                    <div class="st-format-label">${f.label}</div>
                    <div class="st-times">${timesHtml}</div>
                  </div>`;
        }).join('');
        
        html += `
        <div class="st-cinema">
          <div class="st-cinema-header">
            <div>
              <div class="st-cinema-name">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
                ${t.name}
              </div>
              <div class="st-cinema-address">${t.addr}</div>
            </div>
          </div>
          <div class="st-formats">
            ${formatsHtml}
          </div>
        </div>
        `;
      });
      
      container.innerHTML = html;
      
    });
  </script>
</body>
</html>
