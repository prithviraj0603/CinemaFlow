<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${movie.title + ' - CinemaFlow'}">Movie</title>
  
  <link rel="stylesheet" th:href="@{/css/cinema-flow.css}">
  <style>
    .md-hero {
      position: relative;
      height: 65vh;
      min-height: 500px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 2rem;
      background-size: cover;
      background-position: center 20%;
    }
    .md-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--cf-bg-base) 0%, rgba(10,13,20,0.6) 50%, rgba(10,13,20,0) 100%);
    }
    .md-container {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 3rem;
      align-items: flex-end;
    }
    .md-poster {
      width: 260px;
      border-radius: var(--cf-radius-lg);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      transform: translateY(4rem);
    }
    .md-info {
      flex: 1;
      padding-bottom: 1rem;
    }
    .md-title {
      font-family: var(--cf-font-display);
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      line-height: 1.1;
    }
    .md-subtitle {
      font-size: 1.2rem;
      color: var(--cf-text-secondary);
      font-style: italic;
      margin-bottom: 1.5rem;
    }
    .md-meta {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .md-btn-row {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .md-content {
      padding: 6rem 0 4rem;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 4rem;
    }
    .md-synopsis h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--cf-text-primary);
    }
    .md-synopsis p {
      font-size: 1.1rem;
      color: #94A3B8;
      line-height: 1.7;
    }
  </style>
</head>
<body style="background-color: var(--cf-bg-base); color: #FFFFFF; display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Global Header Fragment -->
  <div th:replace="~{fragments/header :: header}"></div>

  <main style="flex: 1;">
    <div class="md-hero" th:style="'background-image: url(' + ${movie.backdropPath} + ')'">
        <div class="cf-container md-container">
            <img th:src="${movie.posterPath}" alt="Poster" class="md-poster">
            <div class="md-info">
               <h1 class="md-title" th:text="${movie.title}">Movie Title</h1>
               <div class="md-subtitle" th:if="${movie.subtitle}" th:text="${movie.subtitle}">Subtitle</div>
               
               <div class="md-meta">
                   <div style="display:flex; align-items:center; gap:0.5rem; background: var(--cf-bg-surface-elevated); padding: 0.4rem 0.8rem; border-radius: 100px;">
                       <span style="color: #FBBF24;">★</span>
                       <span style="font-weight: bold;" th:text="${movie.rating}">8.5</span>
                       <span style="color: var(--cf-text-muted);" th:text="'(' + ${movie.reviewCount} + ')'">500</span>
                   </div>
                   <span th:text="${movie.duration}">2h 30m</span>
                   <span th:text="${movie.censorRating}" style="border: 1px solid var(--cf-border-medium); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.8rem;">PG-13</span>
               </div>
               
               <div class="md-btn-row">
                   <a th:href="@{/movies/{id}/showtimes(id=${movie.id})}" class="cf-btn cf-btn-lg cf-btn-primary" style="padding-left: 2rem; padding-right: 2rem;">
                       <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right: 0.5rem;"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                       Book Tickets
                   </a>
               </div>
            </div>
        </div>
    </div>
    
    <div class="cf-container md-content">
        <div class="md-synopsis">
            <h3>About the Movie</h3>
            <p th:text="${movie.synopsis}">Synopsis goes here...</p>
        </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
