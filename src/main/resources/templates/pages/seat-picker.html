<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Seats - CinemaFlow</title>
  
  <link rel="stylesheet" th:href="@{/css/cinema-flow.css}">
  <style>
    .sp-header {
      background: var(--cf-bg-surface);
      border-bottom: 1px solid var(--cf-border-medium);
      padding: 1.5rem 0;
      position: sticky;
      top: 60px;
      z-index: 90;
    }
    .sp-header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .sp-movie-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--cf-text-primary);
    }
    .sp-movie-meta {
      font-size: 0.9rem;
      color: var(--cf-text-secondary);
      margin-top: 0.25rem;
    }
    
    .sp-seats-container {
      padding: 3rem 0 8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
    }
    
    .sp-screen {
      width: 80%;
      max-width: 600px;
      height: 40px;
      margin-bottom: 4rem;
      border-top: 4px solid var(--cf-accent-primary);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 20px 40px -20px rgba(239, 68, 68, 0.4);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 10px;
      color: var(--cf-text-secondary);
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .sp-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .sp-row-label {
      width: 25px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--cf-text-secondary);
      margin-right: 1rem;
    }
    .sp-gap {
      width: 2rem;
    }
    
    .sp-seat {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: var(--cf-bg-surface-elevated);
      border: 1px solid var(--cf-border-medium);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.7rem;
      color: transparent;
      transition: all 0.2s;
    }
    .sp-seat:hover {
      border-color: var(--cf-accent-primary);
      color: var(--cf-text-primary);
    }
    .sp-seat.selected {
      background: var(--cf-accent-primary);
      border-color: var(--cf-accent-primary);
      color: #fff;
    }
    .sp-seat.sold {
      background: var(--cf-bg-surface);
      border-color: transparent;
      color: var(--cf-text-muted);
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .sp-zone-label {
      width: 100%;
      max-width: 600px;
      text-align: left;
      font-size: 0.85rem;
      color: var(--cf-text-secondary);
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--cf-border-subtle);
    }
    
    .sp-legend {
      display: flex;
      gap: 2rem;
      margin-top: 3rem;
      padding: 1rem 2rem;
      background: var(--cf-bg-surface-elevated);
      border-radius: 20px;
    }
    .sp-legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--cf-text-secondary);
    }
    .sp-legend-box {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }
    
    .sp-footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--cf-bg-surface);
      border-top: 1px solid var(--cf-border-medium);
      padding: 1rem 0;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sp-footer-bar.active {
      transform: translateY(0);
    }
    .sp-footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sp-selection-info {
      display: flex;
      flex-direction: column;
    }
    .sp-selection-seats {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--cf-accent-primary);
    }
    .sp-selection-price {
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body style="background-color: var(--cf-bg-base); color: #FFFFFF;">

  <div th:replace="~{fragments/header :: header}"></div>

  <div class="sp-header">
    <div class="cf-container sp-header-inner">
      <div>
        <div class="sp-movie-title">Dune: Part Two (IMAX 2D)</div>
        <div class="sp-movie-meta">PVR Orion Mall • Today, 08 Oct • 10:30 AM</div>
      </div>
      <div>
        <span class="cf-tag-format-pill">1 Ticket(s) Selected</span>
      </div>
    </div>
  </div>

  <main class="cf-container sp-seats-container">
    
    <div class="sp-screen">All Eyes This Way</div>
    
    <!-- Premium Recliners Zone -->
    <div class="sp-zone-label">PREMIUM RECLINERS - Rs. 450</div>
    <div class="sp-row">
      <div class="sp-row-label">A</div>
      <div class="sp-seat sold">1</div>
      <div class="sp-seat sold">2</div>
      <div class="sp-seat">3</div>
      <div class="sp-seat">4</div>
      <div class="sp-gap"></div>
      <div class="sp-seat">5</div>
      <div class="sp-seat">6</div>
      <div class="sp-seat">7</div>
      <div class="sp-seat">8</div>
    </div>
    
    <!-- Standard Zone -->
    <div class="sp-zone-label">STANDARD - Rs. 280</div>
    <div class="sp-row">
      <div class="sp-row-label">B</div>
      <div class="sp-seat">1</div>
      <div class="sp-seat">2</div>
      <div class="sp-seat">3</div>
      <div class="sp-seat selected">4</div>
      <div class="sp-gap"></div>
      <div class="sp-seat">5</div>
      <div class="sp-seat sold">6</div>
      <div class="sp-seat sold">7</div>
      <div class="sp-seat">8</div>
    </div>
    <div class="sp-row">
      <div class="sp-row-label">C</div>
      <div class="sp-seat">1</div>
      <div class="sp-seat">2</div>
      <div class="sp-seat">3</div>
      <div class="sp-seat">4</div>
      <div class="sp-gap"></div>
      <div class="sp-seat">5</div>
      <div class="sp-seat">6</div>
      <div class="sp-seat sold">7</div>
      <div class="sp-seat sold">8</div>
    </div>
    <div class="sp-row">
      <div class="sp-row-label">D</div>
      <div class="sp-seat">1</div>
      <div class="sp-seat sold">2</div>
      <div class="sp-seat sold">3</div>
      <div class="sp-seat sold">4</div>
      <div class="sp-gap"></div>
      <div class="sp-seat sold">5</div>
      <div class="sp-seat sold">6</div>
      <div class="sp-seat">7</div>
      <div class="sp-seat">8</div>
    </div>
    
    <div class="sp-legend">
      <div class="sp-legend-item">
        <div class="sp-legend-box" style="background: var(--cf-bg-surface-elevated); border: 1px solid var(--cf-border-medium);"></div>
        <span>Available</span>
      </div>
      <div class="sp-legend-item">
        <div class="sp-legend-box" style="background: var(--cf-accent-primary);"></div>
        <span>Selected</span>
      </div>
      <div class="sp-legend-item">
        <div class="sp-legend-box" style="background: var(--cf-bg-surface); opacity: 0.5;"></div>
        <span>Sold</span>
      </div>
    </div>
    
  </main>
  
  <div class="sp-footer-bar active">
    <div class="cf-container sp-footer-inner">
      <div class="sp-selection-info">
        <span class="sp-selection-seats">Selected: B4</span>
        <span class="sp-selection-price">Rs. 280.00</span>
      </div>
      <a id="checkout-btn" href="/payment" class="cf-btn cf-btn-lg cf-btn-primary" style="padding-left: 3rem; padding-right: 3rem;">
        Checkout
      </a>
    </div>
  </div>

  <!-- Since seat picker is a standalone interactive page, we won't clutter it with a fat footer -->
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const seats = document.querySelectorAll('.sp-seat:not(.sold)');
      const seatsLabel = document.querySelector('.sp-selection-seats');
      const priceLabel = document.querySelector('.sp-selection-price');
      const checkoutBtn = document.getElementById('checkout-btn');
      
      checkoutBtn.href = '/payment?amount=280&seats=B4'; // Default starting state based on hardcoded selection
      
      seats.forEach(seat => {
        seat.addEventListener('click', (e) => {
          e.target.classList.toggle('selected');
          
          let selected = document.querySelectorAll('.sp-seat.selected');
          let text = Array.from(selected).map(s => s.parentElement.querySelector('.sp-row-label').textContent + s.textContent).join(', ');
          
          let price = 0;
          selected.forEach(s => {
              let checkEl = s.closest('.sp-row');
              while(checkEl && !checkEl.classList.contains('sp-zone-label')) {
                 checkEl = checkEl.previousElementSibling;
              }
              if(checkEl && checkEl.textContent.includes('PREMIUM')) {
                price += 450;
              } else {
                price += 280;
              }
          });
          
          if(selected.length > 0) {
            seatsLabel.innerHTML = 'Selected: ' + text;
            priceLabel.innerHTML = 'Rs. ' + price + '.00';
            checkoutBtn.href = '/payment?amount=' + price + '&seats=' + encodeURIComponent(text);
            checkoutBtn.style.pointerEvents = 'auto';
            checkoutBtn.style.opacity = '1';
          } else {
            seatsLabel.innerHTML = 'No seats selected';
            priceLabel.innerHTML = 'Rs. 0.00';
            checkoutBtn.href = '#';
            checkoutBtn.style.pointerEvents = 'none';
            checkoutBtn.style.opacity = '0.5';
          }
        });
      });
    });
  </script>
</body>
</html>
